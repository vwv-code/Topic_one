server:
  port: 8080

spring:
  # ====== 数据源配置（MySQL 8.0）======
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/topic_one?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # ====== Redis 缓存配置 ======
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # ====== 文件上传限制 ======
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ====== MyBatis-Plus 配置 ======
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.topicone.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ====== MinIO 对象存储配置 ======
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: topic-one-audio

# ====== AI 服务配置 ======

# 通义千问 LLM（DashScope）
ai:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
  llm:
    model: qwen-turbo  # 可选: qwen-turbo / qwen-plus / qwen-max

# 阿里云语音识别 ASR（Paraformer 实时转写）
asr:
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
  app-key: ${ALIYUN_NLS_APP_KEY:}
  # 音频参数
  format: pcm        # 输入格式：pcm
  sample-rate: 16000 # 采样率：16kHz
  enable-punctuation: true
  enable-intermediate-result: true  # 开启中间结果返回

# 讯飞语音评测（流式版）
xunfei:
  app-id: ${XUNFEI_APP_ID:}
  api-key: ${XUNFEI_API_KEY:}
  api-secret: ${XUNFEI_API_SECRET:}
  mock: ${XUNFEI_MOCK:false}  # 开发阶段用 mock，生产设为 false

# 阿里云语音合成 TTS
tts:
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
  app-key: ${ALIYUN_NLS_APP_KEY:}
  voice: xiaoyun      # 免费发音人：xiaoyun(小云-女)/xiaogang(小刚-男)
  format: pcm          # 输出格式：pcm/mp3
  sample-rate: 16000   # 采样率
  volume: 50           # 音量 0-100
  speech-rate: 0       # 语速 -500~500，0为正常
  pitch-rate: 0        # 语调 -500~500，0为正常

# ====== JWT 配置 ======
jwt:
  secret: ${JWT_SECRET:TopicOne2026SecretKeyForJwtTokenGeneration}
  expiration: 86400000  # Token 有效期：24小时（毫秒）

# ====== 日志配置 ======
logging:
  level:
    com.topicone: debug
    org.springframework.web.socket: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
